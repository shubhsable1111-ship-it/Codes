<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Understanding HTML</title>
</head>

<body>

    <h1>HTML Building Blocks</h1>

    <p>
        HTML stands for HyperText Markup Language. It is used to
        create and structure webpages using tags and elements.
    </p>

    <!-- Example of opening tag, content, and closing tag -->
    <p>This is a paragraph element.</p>

    <!-- Example of a void element -->
    <p>This line ends here.<br>This line starts on a new line.</p>

</body>

</html>
