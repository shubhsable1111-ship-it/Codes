
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attributes in Action</title>
</head>
<body>

    <h1>HTML Attributes</h1>

    <p title="This information appears when you hover over this paragraph.">
        Move your mouse over this paragraph to see extra information.
    </p>

    <h2>Student Details</h2>

    <p style="color: red;">Student 1: Saiprasad</p>
    <p style="color: blue;">Student 2: Manoj</p>
    <p style="color: green;">Student 3: Sayali</p>

    <h2>Image Example</h2>

    <img
        src="https://placehold.co/300x200"
        alt="Sample placeholder image"
        width="300"
        height="200"
    >

</body>
</html>
